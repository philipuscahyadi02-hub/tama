<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icon32.png" alt=""><b>Tama Companion</b></header>
  <p id="status">Looking for Tama…</p>
  <form id="pair" hidden>
    <label for="code">Pairing code from Tama</label>
    <p class="hint">In Tama's terminal type <code>/music pair</code> (or Settings → Music).</p>
    <div class="row"><input id="code" maxlength="12" autocomplete="off" spellcheck="false" placeholder="ABC123"><button type="submit">Pair</button></div>
    <p id="err" class="err"></p>
  </form>
  <button id="unpair" class="link" hidden>Forget this pairing</button>
  <p class="foot">Talks only to the Tama app on this PC. Reads what plays on music.youtube.com; never your sign-in or other sites.</p>
  <script src="popup.js"></script>
</body>
</html>
