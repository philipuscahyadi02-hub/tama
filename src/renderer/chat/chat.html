<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Chat</title>
  <link rel="stylesheet" href="../shared/rig.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header id="titlebar">
    <div id="avatar" class="tama-rig mood-normal"><svg class="rig-svg" viewBox="0 0 200 240"></svg></div>
    <div class="who">
      <div id="name">Tama</div>
      <div id="sub">chat · Gemini via agy</div>
    </div>
    <span class="spacer"></span>
    <button class="wbtn" id="wClear" title="New chat (forget this conversation)">⟲</button>
    <button class="wbtn" id="wTerm" title="Open the terminal for coding work (Ctrl+Alt+K)">💻</button>
    <button class="wbtn close" id="wClose" title="Hide (Ctrl+Alt+J)">✕</button>
  </header>

  <main id="log"></main>

  <div id="typing" class="hidden"><span></span><span></span><span></span><em id="typingText"></em></div>

  <footer id="composer">
    <textarea id="input" rows="1" placeholder="Talk to me~ (Enter to send, Shift+Enter new line)"></textarea>
    <button id="send" title="Send">➤</button>
  </footer>

  <script src="../../shared/palette.js"></script>
  <script src="../../shared/catalog.js"></script>
  <script src="../../shared/spec.js"></script>
  <script src="../../shared/rig/kit.js"></script>
  <script src="../../shared/rig/face.js"></script>
  <script src="../../shared/rig/hair.js"></script>
  <script src="../../shared/rig/headwear.js"></script>
  <script src="../../shared/rig/outfit.js"></script>
  <script src="../../shared/rig/accessories.js"></script>
  <script src="../../shared/rig/compose.js"></script>
  <script src="../shared/rig-view.js"></script>
  <script src="chat.js"></script>
</body>
</html>
