<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Tama</title>
  <link rel="stylesheet" href="../shared/rig.css" />
  <link rel="stylesheet" href="terminal.css" />
</head>
<body>
  <header id="titlebar">
    <div id="avatar" class="tama-rig mood-normal" title=""><svg class="rig-svg" viewBox="0 0 200 240"></svg></div>
    <span class="title" id="title">Tama Code</span>
    <span id="titleCwd" class="dim"></span>
    <span class="spacer"></span>
    <button class="wbtn" id="wMin" title="Minimize">─</button>
    <button class="wbtn" id="wMax" title="Maximize">☐</button>
    <button class="wbtn close" id="wClose" title="Hide (Ctrl+Alt+K)">✕</button>
  </header>

  <main id="screen">
    <div id="transcript"></div>
    <div id="spinner" class="hidden"><span id="spinGlyph">✻</span> <span id="spinVerb">Pondering…</span> <span id="spinMeta" class="dim"></span></div>
  </main>

  <footer id="bottom">
    <div id="perm" class="hidden"></div>
    <div id="slash" class="hidden"></div>
    <div id="inputBox">
      <span class="caret" id="caret">❯</span>
      <textarea id="input" rows="1" spellcheck="false" placeholder='Try "explain this repo" · /help for commands'></textarea>
    </div>
    <div id="hints">
      <span id="modeHint"></span>
      <span class="spacer"></span>
      <span id="statusLine" class="dim"></span>
    </div>
  </footer>
  <script src="../../shared/palette.js"></script>
  <script src="../../shared/catalog.js"></script>
  <script src="../../shared/spec.js"></script>
  <script src="../../shared/theme.js"></script>
  <script src="../../shared/rig/kit.js"></script>
  <script src="../../shared/rig/face.js"></script>
  <script src="../../shared/rig/hair.js"></script>
  <script src="../../shared/rig/headwear.js"></script>
  <script src="../../shared/rig/outfit.js"></script>
  <script src="../../shared/rig/accessories.js"></script>
  <script src="../../shared/rig/compose.js"></script>
  <script src="../shared/rig-view.js"></script>
  <script src="tama-commands.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
