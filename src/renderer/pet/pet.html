<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Tama</title>
  <link rel="stylesheet" href="../shared/rig.css" />
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage">

    <!-- Stats panel -->
    <div id="stats" class="panel hit hidden">
      <div class="panel-head">
        <span id="statsTitle">Kero-chan</span>
        <button class="x" data-close="stats">✕</button>
      </div>
      <div class="stat"><span>🍙 Tummy</span><div class="bar"><i id="b-hunger"></i></div></div>
      <div class="stat"><span>🌸 Mood</span><div class="bar"><i id="b-happy"></i></div></div>
      <div class="stat"><span>⚡ Energy</span><div class="bar"><i id="b-energy"></i></div></div>
      <div class="stat"><span>🫧 Clean</span><div class="bar"><i id="b-clean"></i></div></div>
      <div class="stat"><span>💗 Bond</span><div class="bar bond"><i id="b-bond"></i></div></div>
      <div class="bond-title" id="bondTitle"></div>
      <div class="muted" id="ageLine"></div>
    </div>

    <div id="bubble" class="hidden hit"></div>

    <div id="menu" class="hit hidden">
      <button data-act="feed" title="Feed">🍙</button>
      <button data-act="play" title="Play">🎀</button>
      <button data-act="clean" title="Bath">🛁</button>
      <button data-act="sleep" title="Sleep / wake">💤</button>
      <button data-act="stats" title="Stats">📊</button>
      <button data-act="wardrobe" title="Restyle">🪄</button>
      <button data-act="code" title="Open the terminal (Ctrl+Alt+K)">💻</button>
    </div>

    <div id="fx"></div>

    <div id="pet" class="hit tama-rig mood-normal">
      <div id="emote"></div>
      <div id="gloom"><i></i><i></i><i></i><i></i></div>
      <div id="noseBubble"></div>
      <div id="zzz">z<span>z</span><span>Z</span></div>
      <svg id="kero" class="rig-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <script src="../../shared/palette.js"></script>
  <script src="../../shared/catalog.js"></script>
  <script src="../../shared/spec.js"></script>
  <script src="../../shared/rig/kit.js"></script>
  <script src="../../shared/rig/face.js"></script>
  <script src="../../shared/rig/hair.js"></script>
  <script src="../../shared/rig/headwear.js"></script>
  <script src="../../shared/rig/outfit.js"></script>
  <script src="../../shared/rig/accessories.js"></script>
  <script src="../../shared/rig/compose.js"></script>
  <script src="../shared/rig-view.js"></script>
  <script src="pet.js"></script>
</body>
</html>
