<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https://*.googleusercontent.com https://*.ytimg.com https://*.ggpht.com" />
  <title>Tama · Music</title>
  <link rel="stylesheet" href="music.css" />
</head>
<body>
  <main id="card" class="compact">
    <div id="grip" title="Drag to move"></div>
    <section id="now">
      <div id="disc" aria-hidden="true">
        <div id="vinyl"><span class="label"></span></div>
        <div id="cover"><img id="art" alt="" hidden /><span id="noart" class="ico" data-i="note"></span></div>
      </div>
      <div id="info">
        <div id="kicker"><span id="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="kickerText">Now playing</span></div>
        <div id="title">Nothing playing</div>
        <div id="sub"></div>
      </div>
      <div id="corner">
        <button id="expand" class="tiny ico" data-i="down" title="Up next and lyrics"></button>
        <button id="lookBtn" class="tiny ico" data-i="droplet" title="Look: glass and opacity"></button>
        <button id="close" class="tiny ico" data-i="close" title="Hide for this song"></button>
      </div>
    </section>
    <div id="lookPanel" hidden>
      <div class="row"><span>Look</span>
        <div class="seg"><button data-look="solid">Solid</button><button data-look="glass">Glass</button></div>
      </div>
      <div class="row" title="It turns fully visible while your mouse is over it."><span>Opacity</span><input id="opacity" type="range" min="40" max="100" step="5" /><b id="opacityVal">100%</b></div>
      <button id="beside" class="wide ico" data-i="pin">Put it next to her</button>
    </div>
    <section id="progress">
      <span id="pos">0:00</span>
      <div id="bar" title="Click to jump"><div id="fill"></div><div id="knob"></div></div>
      <span id="dur">0:00</span>
    </section>
    <section id="controls">
      <button id="like" class="ico side" data-i="like" title="Like"></button>
      <button id="prev" class="ico" data-i="prev" title="Previous"></button>
      <button id="toggle" class="ico main" data-i="play" title="Play / pause"></button>
      <button id="next" class="ico" data-i="next" title="Next"></button>
      <button id="dislike" class="ico side" data-i="dislike" title="Dislike"></button>
      <span class="grow"></span>
      <button id="repeat" class="ico small" data-i="repeat" title="Repeat"></button>
      <button id="shuffle" class="ico small" data-i="shuffle" title="Shuffle the queue"></button>
      <div id="vol"><span id="volIcon" class="ico" data-i="volume"></span><input id="volume" type="range" min="0" max="100" step="1" title="Volume" /></div>
    </section>
    <section id="more" hidden>
      <nav id="tabs">
        <button data-tab="queue" class="on"><span class="ico" data-i="queue"></span>Up next</button>
        <button data-tab="lyrics"><span class="ico" data-i="lyrics"></span>Lyrics</button>
        <button id="panelClose" class="tiny ico" data-i="close" title="Close"></button>
      </nav>
      <ol id="queue"></ol>
      <div id="lyrics" hidden></div>
      <footer id="source"></footer>
    </section>
  </main>
  <script src="../../shared/palette.js"></script>
  <script src="../../shared/catalog.js"></script>
  <script src="../../shared/spec.js"></script>
  <script src="../../shared/theme.js"></script>
  <script src="icons.js"></script>
  <script src="music.js"></script>
</body>
</html>
